name: 03-embodied-emissions
description: pipeline to calculate embodied emissions of CPU jobs
tags:
aggregation:
  metrics:
    - carbon/embodied
  type: both
initialize:
  plugins:
    cpu-lookup:
      path: builtin
      method: CSVLookup
      config:
        filepath: ./resources/cpu-model.csv
        query:
          node: node-name
        output: "*"
    embodied-carbon:
      path: builtin
      method: SciEmbodied
      config:
        lifespan: 1.578e+8
        duration: 60
        output-parameter: carbon/embodied
      mapping:
        vCPUs: cores-allocated
      parameter-metadata:
        outputs:
          carbon/embodied:
            description: Total embodied carbon
            unit: gCO2eq
            aggregation-method:
              time: sum
              component: sum

tree:
  children:
    job7984064:
      defaults:
        cores-allocated: 2
        memory: 4
      pipeline:
        observe:
        regroup:
        compute:
          - cpu-lookup
          - embodied-carbon
